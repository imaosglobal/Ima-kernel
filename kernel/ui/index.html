<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="utf-8"/>
<title>IMA Core</title>
<style>
body{background:#0b0b0b; color:white; font-family:sans-serif; text-align:center; padding-top:20px; margin: 0;}
.card{width:90%; max-width: 500px; margin:auto; padding:20px; border-radius:20px; background:#151515;}
#canvas-container {width: 100%; height: 350px; background: #111; border-radius: 10px; position: relative;}
#loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #aaa; width: 90%; font-size: 14px; }
</style>
<!-- הגדרת מפת ייבוא (Import Map) כדי להקל על ה-Modules -->
<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>
</head>
<body>
<div class="card">
<h1>IMA Core</h1>
<p>Autonomous Intelligence System</p>
<div id="canvas-container"><div id="loading">מאתחל ליבה מודרנית...</div></div>
</div>

<script type="module">
// תפיסת שגיאות בתוך Module
window.onerror = function(message, source, lineno, colno, error) {
    document.getElementById('loading').style.color = '#ff4444';
    document.getElementById('loading').innerText = "שגיאה: " + message;
    return false;
};

// ייבוא מפורט ומאובטח
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(45, container.clientWidth/container.clientHeight, 0.1, 1000);
camera.position.set(0, 1, 3);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, 0);
controls.enableDamping = true;

const loader = new GLTFLoader();
loader.load(
    'mother_character.glb', 
    (gltf) => { 
        scene.add(gltf.scene); 
        document.getElementById('loading').style.display = 'none'; 
        
        function animate(){ 
            requestAnimationFrame(animate); 
            gltf.scene.rotation.y += 0.01; 
            controls.update();
            renderer.render(scene, camera); 
        }
        animate();
    },
    null,
    (err) => { 
        document.getElementById('loading').style.color = '#ff4444';
        document.getElementById('loading').innerText = 'שגיאת פענוח קובץ ה-GLB';
        console.error(err);
    }
);
</script>
</body>
</html>

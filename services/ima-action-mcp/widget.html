<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#0b0d12;color:#eef;font:14px system-ui}header{display:flex;gap:8px;padding:10px;border-bottom:1px solid #30343d}input,button{background:#171a21;color:#eef;border:1px solid #3b414d;border-radius:10px;padding:8px}.grow{flex:1}#screen{display:block;width:100%;max-height:68vh;object-fit:contain;background:#000;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}#status{padding:8px 10px;opacity:.8}.controls{display:flex;gap:6px;padding:8px;flex-wrap:wrap}.type{display:flex;gap:6px;padding:8px}.type input{flex:1;min-width:0}@media(max-width:600px){header{padding:8px}.grow{min-width:100%}#screen{max-height:58vh}button{min-height:44px}}</style></head><body><header><strong>IMA — Live Browser</strong><input id="url" class="grow" placeholder="https://..."><button id="go">Open</button><button id="refresh">Refresh</button></header><img id="screen" alt="IMA live browser view"><div id="status">Ready</div><script>const s=document.querySelector('#screen'),st=document.querySelector('#status'),u=document.querySelector('#url');const call=a=>window.openai?.callTool('ima_live_browser',a);async function shot(){const r=await call({action:'screenshot'});let d=r?.structuredContent||r?.content?.[0]?.text;try{d=typeof d==='string'?JSON.parse(d):d}catch{}const b=d?.image||d?.screenshot||d?.data;if(b)s.src=b.startsWith('data:')?b:'data:image/png;base64,'+b;st.textContent='Connected';}document.querySelector('#refresh').onclick=()=>shot();document.querySelector('#go').onclick=async()=>{await call({action:'navigate',url:u.value});await shot()};s.onclick=async e=>{const r=s.getBoundingClientRect();await call({action:'click',x:Math.round((e.clientX-r.left)*s.naturalWidth/r.width),y:Math.round((e.clientY-r.top)*s.naturalHeight/r.height)});await shot()};if(window.openai)shot().catch(e=>st.textContent=e.message);else st.textContent='Open IMA Live Browser from the conversation to start.';</script></body></html>

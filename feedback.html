<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>משוב לאמא — IMA</title>
<meta name="description" content="משוב אמיתי למען שיפור אמא — IMA.">
<style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:32px;line-height:1.7;background:#f7f2e9;color:#211b18}main{background:#fffdf8;padding:28px;border-radius:24px}button,textarea,select{font:inherit;padding:11px;border-radius:12px;border:1px solid #d8cbbd}button{cursor:pointer}textarea{width:100%;min-height:140px}fieldset{border:0;padding:0}label{display:block;margin:8px 0}#status{margin-top:15px}</style>
</head>
<body><main>
<h1>משוב לאמא</h1>
<p>המשוב שלך עוזר לאמא להשתפר. אפשר גם להשאיר משוב בלי להזדהות.</p>
<form id="f">
<fieldset><legend>איך הייתה החוויה?</legend>
<label><input type="radio" name="sentiment" value="useful" required> שימושית</label>
<label><input type="radio" name="sentiment" value="not_useful"> לא שימושית</label>
<label><input type="radio" name="sentiment" value="problem"> מצאתי בעיה</label>
<label><input type="radio" name="sentiment" value="improvement"> יש לי הצעה</label>
</fieldset>
<label>מה תרצה/י שאמא תשמור, תשפר או תעשה אחרת?
<textarea name="text" maxlength="4000" required></textarea></label>
<label>שפה <input name="language" value="he" maxlength="16"></label>
<button type="submit">שליחת משוב</button>
</form><p id="status"></p>
<p><a href="./">חזרה לאמא</a></p>
<script>
const API="https://ima-915m.onrender.com";
document.querySelector("#f").addEventListener("submit",async e=>{
 e.preventDefault(); const f=new FormData(e.target); const status=document.querySelector("#status");
 const payload={sentiment:f.get("sentiment"),text:f.get("text"),language:f.get("language"),page:location.href};
 try{const r=await fetch(API+"/ima-api/feedback",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.error||"failed");status.textContent="המשוב התקבל. תודה.";e.target.reset();}
 catch(err){status.textContent="המשוב לא נשלח כרגע. אפשר לנסות שוב מאוחר יותר.";}
});
</script></main></body></html>

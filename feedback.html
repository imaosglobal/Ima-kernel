<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>משוב לאמא — IMA</title>
<meta name="description" content="משוב אמיתי למען שיפור אמא — IMA.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:32px;line-height:1.7;background:#f7f2e9;color:#211b18}main{background:#fffdf8;padding:28px;border-radius:24px}button,textarea,select{font:inherit;padding:11px;border-radius:12px;border:1px solid #d8cbbd}button{cursor:pointer}textarea{width:100%;min-height:140px}fieldset{border:0;padding:0}label{display:block;margin:8px 0}#status{margin-top:15px}</style>
</head>
<body><main>
<h1>משוב לאמא</h1>
<p>המשוב שלך עוזר לאמא להשתפר. אפשר גם להשאיר משוב בלי להזדהות.</p>
<div id="connection" style="padding:10px 12px;border-radius:12px;background:#f1eadf;margin:12px 0;color:#5f574f">בודקת חיבור לאמא…</div>
<form id="f">
<fieldset><legend>איך הייתה החוויה?</legend>
<label><input type="radio" name="sentiment" value="useful" required> שימושית</label>
<label><input type="radio" name="sentiment" value="not_useful"> לא שימושית</label>
<label><input type="radio" name="sentiment" value="problem"> מצאתי בעיה</label>
<label><input type="radio" name="sentiment" value="improvement"> יש לי הצעה</label>
</fieldset>
<label>מה תרצה/י שאמא תשמור, תשפר או תעשה אחרת?
<textarea name="text" maxlength="4000" required></textarea></label>
<label>שפה <input name="language" value="he" maxlength="16"></label>
<button type="submit">שליחת משוב</button>
</form><p id="status"></p>
<p id="archive-note" style="color:#6d665e;font-size:.9rem">כל משוב מקבל זמן קבלה, תאריך, שעה, שפה, עמוד מקור, מפנה, אזור זמן ומצב חיבור. התוכן נשמר בארכיון המערכת ובספק ניתוח רק כאשר הוא מוגדר.</p>
<p><a href="./">חזרה לאמא</a> · <a href="./privacy.html">פרטיות</a> · <a href="./support.html">תמיכה</a></p>
<script>
const API="https://ima-915m.onrender.com";
const connection=document.querySelector("#connection");
function getToken(){return sessionStorage.getItem("ima_session_token")||localStorage.getItem("ima-public-session-token")||""}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]))}
async function refreshConnection(){
  try{
    const token=getToken();
    const r=await fetch(API+"/ima-api/auth/config",{cache:"no-store"});
    const cfg=await r.json();
    connection.textContent=token ? "מחובר/ת לאמא דרך Google — המשוב יסומן כמשוב ממשתמש/ת מחובר/ת." : "לא מחובר/ת לאמא — אפשר לשלוח משוב גם כאורח/ת.";
    connection.style.background=token ? "#e6f0e8" : "#f1eadf";
    return {token,googleConfigured:Boolean(cfg.google?.enabled)};
  }catch(e){connection.textContent="לא ניתן לבדוק כרגע את מצב החיבור; המשוב עדיין ניתן לשליחה.";return {token:getToken(),googleConfigured:false}}
}
refreshConnection();
document.querySelector("#f").addEventListener("submit",async e=>{
 e.preventDefault(); const f=new FormData(e.target); const status=document.querySelector("#status");
 const now=new Date();
 const payload={
   sentiment:f.get("sentiment"),
   text:f.get("text"),
   language:f.get("language"),
   page:location.href,
   referrer:document.referrer||"direct",
   client_time:now.toISOString(),
   timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||"unknown"
 };
 const headers={"Content-Type":"application/json"};
 const token=getToken(); if(token) headers.Authorization="Bearer "+token;
 try{
   const r=await fetch(API+"/ima-api/feedback",{method:"POST",headers,body:JSON.stringify(payload)});
   const d=await r.json();if(!r.ok||!d.accepted||!d.durable_archive||!d.archive_id)throw Error(d.error||"failed");
   const savedText=String(f.get("text")||"").trim();
   status.innerHTML="המשוב התקבל ונשמר בארכיון המתמשך.<br><strong>מה נשמר:</strong> "+escapeHtml(savedText)+"<br><small>זמן: "+escapeHtml(d.receipt?.received_at||"")+" · מזהה ארכיון: "+escapeHtml(d.archive_id||"")+" · "+(d.receipt?.auth_state==="google_authenticated"?"מחובר/ת Google":"אורח/ת")+"</small>";
   e.target.reset();
 }catch(err){status.textContent="המשוב לא נשמר כרגע. נסה/י שוב מאוחר יותר.";}
});
</script></main></body></html>

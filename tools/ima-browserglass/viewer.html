<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>IMA — Live Browser</title>
  <style>
    html,body{margin:0;background:#08090d;color:#fff;font-family:system-ui,sans-serif}
    body{padding:8px;box-sizing:border-box}
    .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;min-height:28px}
    #status{opacity:.8;font-size:.85rem}
    browser-glass{display:block;width:100%;height:calc(100vh - 58px);min-height:320px;border-radius:12px;overflow:hidden;background:#111}
  </style>
</head>
<body>
  <div class="bar">
    <strong>IMA — חלון דפדפן חי</strong>
    <span id="status">מתחבר…</span>
  </div>
  <browser-glass id="pane" fit="contain"></browser-glass>
  <script src="/browserglass-embed.global.js"></script>
  <script>
    const pane = document.getElementById('pane');
    const status = document.getElementById('status');
    async function session() {
      const r = await fetch('/api/session', {cache:'no-store', credentials:'same-origin'});
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    }
    async function boot() {
      try {
        const s = await session();
        pane.setAttribute('url', s.url);
        pane.setAttribute('token', s.token);
        pane.setAttribute('target-id', s.targetId);
        pane.setAttribute('token-endpoint', '/api/session');
        status.textContent = 'מחובר — סנכרון אוטומטי';
      } catch (e) {
        status.textContent = 'ממתין לחיבור המורשה';
      }
    }
    pane.onTokenExpired = async () => (await session()).token;
    pane.addEventListener('bgls:connected', () => status.textContent = 'חלון חי מחובר — סנכרון אוטומטי');
    pane.addEventListener('bgls:disconnected', () => status.textContent = 'החיבור נותק — מתחבר מחדש');
    pane.addEventListener('bgls:error', e => status.textContent = 'BrowserGlass: ' + (e.detail?.error || 'error'));
    boot();
  </script>
</body>
</html>

<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>IMA — Live Browser</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;background:#08090d;color:#fff;font-family:system-ui,sans-serif;height:100%;overflow:hidden}
    body{padding:8px;display:flex;flex-direction:column;gap:8px}
    .bar,.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;min-height:30px}
    .bar strong{font-size:.95rem}
    #status{opacity:.82;font-size:.82rem}
    .tools{padding:5px;border:1px solid #30333b;border-radius:10px;background:#11131a}
    button,input,textarea{font:inherit}
    button{border:1px solid #3b3f49;background:#1a1d25;color:#fff;border-radius:8px;padding:7px 10px;touch-action:manipulation}
    button.active{outline:2px solid #fff}
    .tool-label{font-size:.78rem;opacity:.8}
    #message{flex:1;min-width:180px;resize:none;height:38px;border:1px solid #3b3f49;border-radius:8px;background:#0c0e14;color:#fff;padding:8px}
    #send{min-width:62px}
    #stage{position:relative;flex:1;min-height:0;border-radius:12px;overflow:hidden;background:#111}
    browser-glass{position:absolute;inset:0;display:block;width:100%;height:100%;background:#111}
    #ink{position:absolute;inset:0;width:100%;height:100%;touch-action:none;pointer-events:none}
    #ink.pen{pointer-events:auto;cursor:crosshair}
    .hint{font-size:.72rem;opacity:.62}
  </style>
</head>
<body>
  <div class="bar">
    <strong>IMA — חלון דפדפן חי</strong>
    <span id="status">מתחבר…</span>
  </div>
  <div class="tools" aria-label="כלי עבודה">
    <button id="pen" type="button">עט</button>
    <button id="rect" type="button">מלבן</button>
    <button id="arrow" type="button">חץ</button>
    <button id="erase" type="button">מחק</button>
    <button id="undo" type="button">בטל</button>
    <button id="clear" type="button">נקה סימונים</button><button id="device" type="button">מסך Android</button><button id="deviceBack" type="button">חזרה</button><button id="deviceHome" type="button">בית</button><button id="teamviewer" type="button">TeamViewer</button><input id="teamviewerId" inputmode="numeric" autocomplete="off" placeholder="TeamViewer ID" aria-label="TeamViewer ID" style="width:150px">
    <span class="tool-label">עובי</span><input id="width" type="range" min="2" max="16" value="4">
    <span class="tool-label">צבע</span><input id="color" type="color" value="#ff3b30">
    <textarea id="message" aria-label="מסר לאמא ולעוזר" placeholder="כתוב כאן מה תרצה שאקבל יחד עם מצב החלון…"></textarea>
    <button id="send" type="button">שלח</button>
    <span class="hint">המסר מקבל אישור רק אחרי שהמארח מאשר שקיבל אותו.</span>
  </div>
  <div id="stage">
    <browser-glass id="pane" fit="contain"></browser-glass>
    <img id="deviceScreen" alt="מסך Android חי" hidden style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000">
    <canvas id="ink" aria-label="שכבת סימון"></canvas>
  </div>

  <script src="/browserglass-embed.global.js"></script>
  <script>
    const pane=document.getElementById('pane'), status=document.getElementById('status');
    const canvas=document.getElementById('ink'), ctx=canvas.getContext('2d');
    const message=document.getElementById('message');
    let mode=null, drawing=false, start=null, current=null, history=[];
    const state={sent:0,acked:0};

    function resize(){
      const r=canvas.getBoundingClientRect(), dpr=Math.max(1,window.devicePixelRatio||1);
      const old=document.createElement('canvas'); old.width=canvas.width; old.height=canvas.height;
      if(canvas.width&&canvas.height) old.getContext('2d').drawImage(canvas,0,0);
      canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      if(old.width&&old.height) ctx.drawImage(old,0,0,old.width/dpr,old.height/dpr);
    }
    new ResizeObserver(resize).observe(canvas.parentElement); resize();

    function snapshot(){ history.push(canvas.toDataURL('image/png')); if(history.length>30) history.shift(); }
    function restore(data){
      ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);
      if(!data)return;
      const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,canvas.clientWidth,canvas.clientHeight); img.src=data;
    }
    function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
    function style(){ctx.strokeStyle=document.getElementById('color').value;ctx.lineWidth=+document.getElementById('width').value;ctx.lineCap='round';ctx.lineJoin='round';}
    function line(a,b){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
    function shape(a,b){
      style();
      if(mode==='rect'){ctx.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y);return;}
      if(mode==='arrow'){
        line(a,b);const ang=Math.atan2(b.y-a.y,b.x-a.x),len=12;
        line(b,{x:b.x-len*Math.cos(ang-.55),y:b.y-len*Math.sin(ang-.55)});
        line(b,{x:b.x-len*Math.cos(ang+.55),y:b.y-len*Math.sin(ang+.55)});
      }
    }
    canvas.addEventListener('pointerdown',e=>{
      if(!mode)return; drawing=true;canvas.setPointerCapture(e.pointerId);start=current=point(e);snapshot();style();
      if(mode==='pen'||mode==='erase'){if(mode==='erase')ctx.globalCompositeOperation='destination-out';else ctx.globalCompositeOperation='source-over';ctx.beginPath();ctx.moveTo(current.x,current.y);}
    });
    canvas.addEventListener('pointermove',e=>{
      if(!drawing)return;const p=point(e);
      if(mode==='pen'||mode==='erase'){line(current,p);current=p;return;}
      restore(history[history.length-1]);shape(start,p);current=p;
    });
    canvas.addEventListener('pointerup',e=>{if(!drawing)return;drawing=false;ctx.globalCompositeOperation='source-over';canvas.releasePointerCapture(e.pointerId);});
    function setMode(m){
      mode=m;document.querySelectorAll('.tools button').forEach(b=>b.classList.remove('active'));
      const b=document.getElementById(m);if(b)b.classList.add('active');canvas.classList.toggle('pen',!!m);
    }
    ['pen','rect','arrow','erase'].forEach(id=>document.getElementById(id).onclick=()=>setMode(mode===id?null:id));
    document.getElementById('undo').onclick=()=>restore(history.pop()||null);
    document.getElementById('clear').onclick=()=>{snapshot();ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);};
    window.addEventListener('resize',resize);

    let deviceMode=new URLSearchParams(location.search).get('device')==='1', deviceTimer=null, lastDeviceFrameAt=0;
    let deviceStream=null, deviceStreamBuffer=new Uint8Array(0);
    function stopDeviceStream(){ if(deviceStream){deviceStream.close();deviceStream=null;} deviceStreamBuffer=new Uint8Array(0); }
    function consumeDeviceStream(){
      const marker=new TextEncoder().encode('\r\n\r\n');
      while(true){
        let headerEnd=-1; for(let i=0;i<=deviceStreamBuffer.length-marker.length;i++){let ok=true;for(let j=0;j<marker.length;j++)if(deviceStreamBuffer[i+j]!==marker[j]){ok=false;break;}if(ok){headerEnd=i;break;}}
        if(headerEnd<0)return;
        const header=new TextDecoder().decode(deviceStreamBuffer.slice(0,headerEnd));
        const m=header.match(/Content-Length:\s*(\d+)/i); if(!m){deviceStreamBuffer=deviceStreamBuffer.slice(headerEnd+4);continue;}
        const len=Number(m[1]), bodyStart=headerEnd+4; if(deviceStreamBuffer.length<bodyStart+len+2)return;
        const body=deviceStreamBuffer.slice(bodyStart,bodyStart+len); deviceStreamBuffer=deviceStreamBuffer.slice(bodyStart+len+2);
        const url=URL.createObjectURL(new Blob([body],{type:(header.match(/Content-Type:\s*([^\r\n]+)/i)||[])[1]||'image/png'}));
        const img=document.getElementById('deviceScreen'), old=img.src; img.src=url; img.hidden=false; if(old&&old.startsWith('blob:'))URL.revokeObjectURL(old); pane.style.display='none';
        const frameAt=Number((header.match(/X-IMA-Frame-At:\s*(\d+)/i)||[])[1]||0); lastDeviceFrameAt=frameAt;
        const age=frameAt?Math.max(0,Date.now()-frameAt):0; status.textContent='מסך Android — חי · '+Math.round(age/1000)+'s';
      }
    }
    function startDeviceStream(){
      stopDeviceStream();
      const url='/api/device/stream?ts='+Date.now();
      deviceStream=new EventSource(url);
      deviceStream.onmessage=()=>{};
      deviceStream.onopen=()=>{status.textContent='מסך Android — חיבור חי';};
      deviceStream.onerror=()=>{status.textContent='מחדש חיבור למסך Android…';stopDeviceStream();setTimeout(()=>{if(deviceMode)startDeviceStream();},1000);};
      const original=EventSource.prototype; // keep connection semantics explicit; binary stream is handled below.
      deviceStream.close();
      deviceStream=null;
      fetch(url,{cache:'no-store',credentials:'same-origin'}).then(async r=>{
        if(!r.ok)throw new Error('device stream '+r.status);
        status.textContent='מסך Android — חיבור חי';
        const reader=r.body.getReader();
        while(deviceMode){ const {done,value}=await reader.read(); if(done)break; const next=new Uint8Array(deviceStreamBuffer.length+value.length); next.set(deviceStreamBuffer); next.set(value,deviceStreamBuffer.length); deviceStreamBuffer=next; consumeDeviceStream(); }
      }).catch(()=>{ if(deviceMode){status.textContent='מחדש חיבור למסך Android…';setTimeout(()=>{if(deviceMode)startDeviceStream();},1000);} });
    }
    async function refreshDevice(){ if(!deviceMode) return; startDeviceStream(); }
    async function callDeviceTool(action, args={}){
      try{
        if(window.openai?.callTool) return await window.openai.callTool('ima_device_action',{action,...args});
        return await hostCall('tools/call',{name:'ima_device_action',arguments:{action,...args}});
      }catch(e){ status.textContent='פעולת מכשיר נכשלה: '+e.message; throw e; }
    }
    function devicePoint(e){
      const img=document.getElementById('deviceScreen'); const r=img.getBoundingClientRect();
      const nw=img.naturalWidth||r.width, nh=img.naturalHeight||r.height;
      const scale=Math.min(r.width/nw,r.height/nh); const w=nw*scale, h=nh*scale;
      const ox=r.left+(r.width-w)/2, oy=r.top+(r.height-h)/2;
      return {x:Math.max(0,Math.min(nw,(e.clientX-ox)/scale)),y:Math.max(0,Math.min(nh,(e.clientY-oy)/scale))};
    }
    let deviceGesture=null;
    document.getElementById('deviceScreen').addEventListener('pointerdown',e=>{
      if(!deviceMode)return; deviceGesture={p:devicePoint(e),t:Date.now()}; e.currentTarget.setPointerCapture?.(e.pointerId);
    });
    document.getElementById('deviceScreen').addEventListener('pointerup',async e=>{
      if(!deviceMode||!deviceGesture)return; const end=devicePoint(e), start=deviceGesture.p, duration=Math.max(100,Math.min(3000,Date.now()-deviceGesture.t)); deviceGesture=null;
      const dx=end.x-start.x,dy=end.y-start.y;
      try{
        if(Math.hypot(dx,dy)>24) await callDeviceTool('android_swipe',{x1:start.x,y1:start.y,x2:end.x,y2:end.y,duration_ms:duration});
        else await callDeviceTool('android_tap',{x:end.x,y:end.y});
        setTimeout(refreshDevice,180);
      }catch{}
    });
    async function deviceCommand(action,args={}){try{await callDeviceTool(action,args);setTimeout(refreshDevice,180);}catch{}}
    
    async function startDeviceMode(){
      deviceMode=true; document.getElementById('deviceScreen').hidden=false;
      await refreshDevice();
      if(deviceTimer)clearInterval(deviceTimer);
      deviceTimer=null;
      startDeviceStream();
    }
    document.getElementById('device').onclick=async()=>{ await startDeviceMode(); };
    document.getElementById('deviceBack').onclick=()=>deviceCommand('android_back');
    document.getElementById('teamviewer').onclick=()=>{
      const id=document.getElementById('teamviewerId').value.trim().replace(/\\s+/g,'');
      if(!/^\\d{6,12}$/.test(id)){status.textContent='הזן TeamViewer ID תקין';document.getElementById('teamviewerId').focus();return;}
      const url='https://start.teamviewer.com/'+encodeURIComponent(id);
      window.open(url,'_blank','noopener,noreferrer');
      status.textContent='TeamViewer נפתח — האישור והשליטה נשארים ב-TeamViewer';
    };
    document.getElementById('deviceHome').onclick=()=>deviceCommand('android_home');

    async function session(){
      const r=await fetch('/api/session',{cache:'no-store',credentials:'same-origin'});
      if(!r.ok)throw new Error(await r.text()); return r.json();
    }
    async function boot(){
      try{const s=await session();pane.setAttribute('url',s.url);pane.setAttribute('token',s.token);pane.setAttribute('target-id',s.targetId);pane.setAttribute('token-endpoint','/api/session');status.textContent='מחובר — סנכרון אוטומטי';}
      catch(e){status.textContent='ממתין לחיבור המורשה';}
    }
    pane.onTokenExpired=async()=> (await session()).token;
    pane.addEventListener('bgls:connected',()=>{status.textContent='חלון חי מחובר — סנכרון אוטומטי';window.parent.postMessage({type:'ima-live-status',text:'חלון חי מחובר — סנכרון אוטומטי'},'*');});
    pane.addEventListener('bgls:disconnected',()=>{status.textContent='החיבור נותק — מתחבר מחדש';window.parent.postMessage({type:'ima-live-status',text:'החיבור נותק — מתחבר מחדש'},'*');});
    pane.addEventListener('bgls:error',e=>{const t='BrowserGlass: '+(e.detail?.error||'error');status.textContent=t;window.parent.postMessage({type:'ima-live-status',text:t},'*');});

    function hostCall(method,params){
      return new Promise((resolve,reject)=>{
        if(!window.parent||window.parent===window){reject(new Error('NO_MCP_HOST'));return;}
        const id='ima-'+Date.now()+'-'+Math.random().toString(36).slice(2);
        const timer=setTimeout(()=>{window.removeEventListener('message',on);reject(new Error('HOST_TIMEOUT'));},8000);
        function on(e){const d=e.data;if(d?.jsonrpc==='2.0'&&d.id===id){clearTimeout(timer);window.removeEventListener('message',on);d.error?reject(new Error(d.error.message||'HOST_ERROR')):resolve(d.result);}}
        window.addEventListener('message',on);
        window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');
      });
    }
    async function updateModelContext(payload){
      return hostCall('ui/update-model-context',{
        content:[{
          type:'text',
          text:JSON.stringify({browser:payload.browser,text:payload.text,annotationPresent:!!payload.annotationPng}),
          annotations:{audience:['assistant']}
        }]
      });
    }
    async function deliver(text,withImage){
      const payload={text, browser:{url:pane.getAttribute('url')||'', mode, timestamp:new Date().toISOString()}};
      if(withImage)payload.annotationPng=canvas.toDataURL('image/png');
      const content=[{type:'text',text:JSON.stringify(payload)}];
      try{
        const contextResult=await updateModelContext(payload);
        const result=await hostCall('ui/message',{role:'user',content});
        return {ok:true,result,contextResult};
      }catch(e){
        if(typeof window.openai?.sendFollowUpMessage==='function'){
          await window.openai.sendFollowUpMessage({prompt:text});
          return {ok:true,fallback:true};
        }
        throw e;
      }
    }
    document.getElementById('send').onclick=async()=>{
      const text=message.value.trim(); if(!text){message.focus();return;}
      const btn=document.getElementById('send');btn.disabled=true;state.sent++;
      status.textContent='שולח ומאמת קבלה…';
      try{
        const r=await deliver(text,true);state.acked++;
        status.textContent='✓ התקבל אצל המארח — '+state.acked+' מסרים מאומתים';
        message.value='';setTimeout(()=>{if(state.sent===state.acked)status.textContent='חלון חי מחובר — סנכרון אוטומטי';},2200);
      }catch(e){status.textContent='לא התקבל: '+e.message;}
      finally{btn.disabled=false;}
    };
    message.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')document.getElementById('send').click();});
    boot();
    if(deviceMode) startDeviceMode();
  </script>
</body>
</html>

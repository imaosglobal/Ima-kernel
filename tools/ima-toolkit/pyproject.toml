[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ima-os-toolkit"
version = "1.1.0"
description = "IMA PR Reviewer - AI code review with recovery plan"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{name="IMA OS"}]
dependencies = ["requests"]

[project.scripts]
ima = "ima:main"

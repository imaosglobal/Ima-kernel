name: Community task
description: Create a small concrete task that another contributor can implement independently
title: "[Community Task] "
labels: ["help wanted"]
body:
  - type: textarea
    id: task
    attributes:
      label: Concrete task
      description: Describe one implementation task, not a broad wish.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State what must be true for the task to be considered complete.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Relevant files
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Explain how a contributor can test the result.

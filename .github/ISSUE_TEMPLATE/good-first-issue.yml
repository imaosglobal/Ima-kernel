name: Good first issue
description: Create a task suitable for a new contributor
title: "[Good First Issue] "
labels: ["good first issue", "help wanted"]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: Describe one concrete, bounded task.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Explain exactly what must be true when the task is complete.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Relevant files

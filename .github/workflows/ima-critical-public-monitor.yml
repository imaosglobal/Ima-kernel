name: IMA Critical Public Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ima-critical-public-monitor
  cancel-in-progress: true

jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical source contracts
        run: |
          set -euo pipefail
          grep -Fq 'MamaFigure' ima-ui/src/App.jsx
          grep -Fq 'ChatPanel' ima-ui/src/App.jsx
          grep -Fq 'chat-only-panel' ima-ui/src/App.jsx
          grep -Fq 'SUPPORT_URL' ima-ui/src/App.jsx
          grep -Fq 'PRIVACY_URL' ima-ui/src/App.jsx
          grep -Fq 'GOOGLE_CAMPAIGN_URL' ima-ui/src/App.jsx
          grep -Fq 'renderButton' ima-ui/src/App.jsx
          grep -Fq 'beforeinstallprompt' ima-ui/src/App.jsx
          grep -Fq 'ima-192.svg' ima-ui/public/manifest.json
          grep -Fq 'ima-512.svg' ima-ui/public/manifest.json
          echo "IMA_SOURCE_CRITICAL_CONTRACTS=PASS"
      - name: Verify public deployment identity
        env:
          SITE: https://imaosglobal.github.io/Ima-kernel/
        run: |
          set -euo pipefail
          expected=$(git rev-parse HEAD)
          version=$(curl -fsSL --retry 2 --connect-timeout 8 --max-time 15 "$SITE/version.json?ts=$(date +%s%N)")
          printf '%s' "$version" | grep -Fq "\"version\": \"$expected\"" || {
            echo "PUBLIC_VERSION_MISMATCH expected=$expected actual=$version"
            exit 2
          }
          SITE_ROOT="${SITE%/}"
          curl -fsSL --retry 2 --connect-timeout 8 --max-time 15 "$SITE_ROOT/?v=$expected" -o /tmp/index.html
          curl -fsSL --retry 2 --connect-timeout 8 --max-time 15 "$SITE_ROOT/?v=$expected&cachebust=$(date +%s%N)" -o /tmp/index-cachebust.html
          for file in /tmp/index.html /tmp/index-cachebust.html; do
            grep -Fq "<meta name=\"ima-build-version\" content=\"$expected\">" "$file"
            grep -Fq 'id="root"' "$file"
            grep -Eq 'assets/index-[^"]+\.js' "$file"
            grep -Fq 'accounts.google.com/gsi/client' "$file"
          done
          echo "IMA_PUBLIC_INDEX_NORMAL_AND_CACHE_BUSTED=VERIFIED"
          for path in manifest.json support.html privacy.html feedback.html; do
            curl -fsSL --retry 2 --connect-timeout 8 --max-time 15 "$SITE_ROOT/$path" >/dev/null
          done
          echo "IMA_PUBLIC_INDEX_AND_STATIC_ASSETS=VERIFIED"
  skip-non-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Production monitor is restricted to main."

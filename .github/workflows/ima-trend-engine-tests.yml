name: IMA Trend Engine Tests

on:
  push:
    paths:
      - "ima_trend_engine.py"
      - "tests/test_ima_trend_engine.py"
      - ".github/workflows/ima-trend-engine-tests.yml"
  pull_request:
    paths:
      - "ima_trend_engine.py"
      - "tests/test_ima_trend_engine.py"
      - ".github/workflows/ima-trend-engine-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -p "test_ima_trend_engine.py" -v

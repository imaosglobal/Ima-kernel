name: IMA Unified Loop

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: ima-web-intelligence-state-writer
  cancel-in-progress: false

jobs:
  unified:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - name: Start from the latest canonical main before generating state
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run canonical tests
        run: python -m unittest discover -s tests -t . -p "test_*.py" -v
      - name: Reconcile the public IMA product surface
        run: python scripts/ima_public_reconciliation.py
      - name: Run the whole-system perspective review
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('.ima/multi_perspective/review.json')
          lenses=['user','customer','executive','operator','technical','research','creator','community','institution','privacy','compliance','finance','infrastructure','distribution','future','environment','accessibility','caregiver','young_user','older_user','agent_user']
          scales=['micro','product','macro','system_of_systems']
          horizons=['now','near_term','one_year','multi_year','intergenerational']
          record={'schema':'IMA-MULTI-PERSPECTIVE-1.0','timestamp':datetime.now(timezone.utc).replace(microsecond=0).isoformat(),'lenses':lenses,'scales':scales,'horizons':horizons,'single_scheduler':True,'truth_rule':'Source code and documentation are not runtime proof.'}
          p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(record,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')
          print('IMA_MULTI_PERSPECTIVE=PASS')
          PY
      - name: Run the single canonical IMA loop
        run: python .ima/loop/unified_loop.py
      - name: Persist canonical loop state
        run: |
          git config user.name "IMA Unified Loop"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "::error::main advanced during this cycle; refusing to merge generated state"
            exit 1
          fi
          python -m json.tool .ima/web_intelligence/state.json >/dev/null
          if grep -nE '^(<<<<<<<|=======|>>>>>>>)' .ima/web_intelligence/state.json; then
            echo "::error::merge conflict markers detected in web-intelligence state"
            exit 1
          fi
          git add -A .ima/loop/UNIFIED_LOOP_STATE.json .ima/public_reconciliation/state.json .ima/multi_perspective/review.json .ima/distribution/prepared_queue.json .ima/growth/GLOBAL_GROWTH_STATE.json .ima/web_intelligence/state.json artifacts/web-intelligence .ima/evolution .ima/journal/daily docs/IMA_SELF_EVOLUTION_TIMELINE.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: record unified IMA loop cycle"
          git push
      - name: Trigger canonical Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=ima-canonical-deploy
          echo "IMA_CANONICAL_DEPLOY_DISPATCH=REQUESTED"
      - name: Report loop failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'IMA unified loop failure';
            const body = [
              'The canonical unified IMA loop failed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit: ${context.sha}`,
              '',
              'Diagnose from the actual workflow logs before changing code.'
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: ['ima-unified-loop-failure'], per_page: 10
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['ima-unified-loop-failure']
              });
            }

name: IMA Canonical Verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ima-canonical
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install root dependencies
        run: npm install --ignore-scripts
      - name: Canonical integrity
        run: npm run ima:integrity
      - name: Core tests
        run: npm test
      - name: Relational-care regression
        run: node tests/ima_relational_care.test.cjs
      - name: Public UI contract
        run: npm run test:public-ui
      - name: Production truth
        run: node -e "const r=require('./kernel/runtime/CANONICAL/IMA_PRODUCTION_GATE').verify(); console.log(JSON.stringify(r,null,2)); if(!r.production_policy_gate) process.exit(1)"

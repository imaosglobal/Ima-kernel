name: IMA Community Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome contributor
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              "## Welcome to IMA",
              "",
              "Thank you for contributing to IMA.",
              "",
              "IMA is built to grow through independent contributors worldwide.",
              "",
              "### Start here",
              "- Read `DISCOVER_IMA.md`",
              "- Read `CONTRIBUTING.md`",
              "- Check the Community Roadmap",
              "- Preserve provenance and attribution",
              "- Keep original artifacts intact",
              "- Test and document your changes",
              "",
              "For implementation tasks, look for `help wanted` or `good first issue`.",
              "",
              "The project values human agency, verification, portability and continuity across generations."
            ].join("\n");

            const isIssue = context.eventName === "issues";
            const number = isIssue
              ? context.payload.issue.number
              : context.payload.pull_request.number;

            if (isIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body
              });
            }

name: IMA Firecrawl Live Browser QA

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firecrawl-live-qa:
    name: Firecrawl Live Browser — public IMA smoke
    runs-on: ubuntu-latest
    env:
      IMA_PUBLIC_SITE: ${{ vars.IMA_PUBLIC_SITE || 'https://imaosglobal.github.io/Ima-kernel/' }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
    steps:
      - name: Check Firecrawl credential availability
        id: credential
        run: |
          if [ -z "$FIRECRAWL_API_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIRECRAWL_API_KEY is not configured; live Firecrawl smoke is recorded as UNVERIFIED rather than failing the canonical build."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Launch Firecrawl Browser session
        if: steps.credential.outputs.available == 'true'
        id: launch
        run: |
          set -euo pipefail
          response=$(curl -fsS -X POST "https://api.firecrawl.dev/v2/interact" \
            -H "Authorization: Bearer $FIRECRAWL_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"ttl":300,"activityTtl":120}')
          echo "$response"
          session_id=$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$response")
          echo "session_id=$session_id" >> "$GITHUB_OUTPUT"

      - name: Run live browser smoke tests
        if: steps.credential.outputs.available == 'true'
        env:
          SESSION_ID: ${{ steps.launch.outputs.session_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, requests, sys

          api="https://api.firecrawl.dev/v2/interact/"+os.environ["SESSION_ID"]+"/execute"
          headers={
            "Authorization":"Bearer "+os.environ["FIRECRAWL_API_KEY"],
            "Content-Type":"application/json",
          }
          site=os.environ["IMA_PUBLIC_SITE"]

          code=r"""
          import asyncio
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  page=await browser.new_page(viewport={"width":390,"height":844}, locale="he-IL")
                  await page.goto(SITE, wait_until="networkidle", timeout=60000)
                  await page.wait_for_timeout(1500)

                  title=await page.title()
                  text=await page.locator("body").inner_text()
                  google=await page.locator('iframe[src*="accounts.google.com"], [id*="google"], [class*="google"]').count()
                  installs=await page.get_by_text("התקנה", exact=False).count()
                  links=await page.locator("a[href]").count()

                  assert "אמא" in title or "IMA" in title, f"unexpected title: {title}"
                  assert "IMA" in text, "IMA brand missing"
                  assert links > 0, "no navigation links found"

                  print(json.dumps({
                      "site": SITE,
                      "title": title,
                      "google_related_elements": google,
                      "install_text_matches": installs,
                      "links": links,
                      "status": "PASS"
                  }, ensure_ascii=False))

                  await browser.close()

          asyncio.run(main())
          """

          payload={"code":code.replace("SITE",json.dumps(site)),"language":"python"}
          r=requests.post(api,headers=headers,json=payload,timeout=300)
          r.raise_for_status()
          result=r.json()
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if not result.get("success", True):
              sys.exit(1)
          if result.get("exitCode") not in (None,0):
              sys.exit(result["exitCode"])

      - name: Record unavailable Firecrawl smoke
        if: steps.credential.outputs.available != 'true'
        run: echo "LIVE_BROWSER_SMOKE=UNVERIFIED (missing optional Firecrawl credential)"

      - name: Close Firecrawl Browser session
        if: always()
        env:
          SESSION_ID: ${{ steps.launch.outputs.session_id }}
        run: |
          if [ -n "${SESSION_ID:-}" ]; then
            curl -fsS -X DELETE "https://api.firecrawl.dev/v2/interact/$SESSION_ID" \
              -H "Authorization: Bearer $FIRECRAWL_API_KEY" || true
          fi

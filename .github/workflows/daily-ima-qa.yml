name: IMA Daily QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Public smoke + monkey QA
        env:
          SITE: https://imaosglobal.github.io/Ima-kernel/
          API: https://ima-915m.onrender.com
        run: |
          python - <<'PY'
          import os, random, re, requests
          from bs4 import BeautifulSoup
          site=os.environ["SITE"]
          api=os.environ["API"]
          s=requests.Session()
          r=s.get(site,timeout=20); r.raise_for_status()
          soup=BeautifulSoup(r.text,"html.parser")
          assert soup.title and "אמא" in soup.title.text
          assert soup.find("html",attrs={"dir":"rtl"})
          assert soup.select_one("#google-button")
          assert soup.select_one("#chat-app")
          assert "chat-app open" not in r.text
          assert soup.select_one("#google-button")
          assert soup.select_one("#google-button")
          assert "גניזה" not in r.text
          assert "post-login-tabs" in r.text
          # Landing page must not expose the post-login tab controls.
          landing_tabs=soup.select("nav .tab, .hero .tab, #login-area .tab")
          assert not landing_tabs
          assert soup.find("a",string=re.compile("להכיר את אמא"))
          links=[a.get("href") for a in soup.find_all("a",href=True)]
          internal=[x for x in links if x.startswith("./") and x.endswith(".html")]
          random.shuffle(internal)
          for href in internal:
              u=site+href[2:]
              rr=s.get(u,timeout=20)
              assert rr.status_code==200,(u,rr.status_code)
              assert "אמא" in rr.text,(u,"missing brand")
          health=s.get(api+"/health",timeout=20); assert health.status_code==200
          cfg=s.get(api+"/ima-api/auth/config",timeout=20); assert cfg.status_code==200
          bad=s.post(api+"/ima-api/chat",json={"message":"QA unauthorized probe"},timeout=20)
          assert bad.status_code==401,(bad.status_code,bad.text)
          print("IMA QA PASS: landing, links, RTL, gated chat, API health, auth config, unauthorized chat")
          print("Google enabled:", cfg.json().get("google",{}).get("enabled"))
          PY

      - name: Check obvious product regressions
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path("index.html").read_text(encoding="utf-8")
          forbidden=["אפשר פשוט לדבר עם אמא","כדי לדבר עם אמא יש להתחבר תחילה"]
          for item in forbidden:
              assert item not in text, f"regression: {item}"
          for required in ["להכיר את אמא","human-centered-intelligence.html","compassion.html","global.html"]:
              assert required in text, f"missing: {required}"
          assert "גניזה" not in text
          assert "ארכיון" not in text
          assert "כניסה לאמא</div>" not in text
          print("IMA product regression checks PASS")
          PY


      - name: Browser E2E — landing controls and post-login layout
        env:
          SITE: https://imaosglobal.github.io/Ima-kernel/
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          site=os.environ["SITE"]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={"width":390,"height":844}, locale="he-IL")
              page.goto(site, wait_until="networkidle", timeout=60000)
              page.wait_for_timeout(1500)
              assert page.locator("#google-button").count() == 1
              assert page.locator(".post-login-tabs").count() == 1
              assert not page.locator(".post-login-tabs").is_visible()
              assert page.locator("text=גניזה").count() == 0
              assert page.locator("text=ארכיון").count() == 0
              page.locator("a:has-text('להכיר את אמא')").click()
              assert "#about" in page.url
              assert page.locator("#about").is_visible()
              page.locator("a:has-text('אמא')").first.click()
              assert "#about" in page.url
              print("IMA browser E2E PASS: landing CTA, Google entry, hidden post-login tabs, no Geniza")
              browser.close()
          PY

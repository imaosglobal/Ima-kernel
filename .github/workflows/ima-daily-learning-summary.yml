name: IMA Daily Learning Summary

on:
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * *"
      timezone: "Asia/Jerusalem"

permissions:
  contents: write

concurrency:
  group: ima-daily-learning-summary
  cancel-in-progress: true

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build concise daily learning summary
        run: python .ima/web_intelligence/daily_summary.py
      - name: Persist daily summary and journal
        run: |
          git add .ima/journal/daily/ artifacts/web-intelligence/daily-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "IMA Daily Learning Steward"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: record daily IMA learning summary"
          git push

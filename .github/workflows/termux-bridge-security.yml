name: IMA Termux Bridge Security

on:
  push:
    paths:
      - "tools/termux-ima-bridge/**"
  pull_request:
    paths:
      - "tools/termux-ima-bridge/**"

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify cloud command boundary
        run: python3 tools/termux-ima-bridge/test_cloud_action_policy.py

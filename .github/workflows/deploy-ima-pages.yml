name: Deploy canonical IMA public product

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ima-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ima-ui/package-lock.json

      - name: Install dependencies
        working-directory: ima-ui
        run: npm ci

      - name: Build canonical public IMA
        working-directory: ima-ui
        run: npm run build

      - name: Publish dist to the single GitHub Pages branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/ima-gh-pages
          git worktree add /tmp/ima-gh-pages origin/gh-pages
          find /tmp/ima-gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R ima-ui/dist/. /tmp/ima-gh-pages/
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('/tmp/ima-gh-pages')
          index = root / 'index.html'
          text = index.read_text(encoding='utf-8')
          text = text.replace('__IMA_BUILD_VERSION__', os.environ['GITHUB_SHA'])
          index.write_text(text, encoding='utf-8')
          (root / 'version.json').write_text(json.dumps({'version': os.environ['GITHUB_SHA']}, ensure_ascii=False), encoding='utf-8')
          PY
          touch /tmp/ima-gh-pages/.nojekyll
          cd /tmp/ima-gh-pages
          git config user.name "IMA Pages Deploy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "IMA_PAGES=UNCHANGED"
            exit 0
          fi
          git commit -m "chore: deploy canonical IMA public product"
          git push origin HEAD:gh-pages
          git fetch origin gh-pages
          if ! grep -q "$GITHUB_SHA" /tmp/ima-gh-pages/index.html; then
            echo "ERROR: gh-pages index.html does not contain deployed source SHA $GITHUB_SHA"
            exit 1
          fi
          if ! grep -q "\"version\": \"$GITHUB_SHA\"" /tmp/ima-gh-pages/version.json; then
            echo "ERROR: gh-pages version.json does not match source SHA $GITHUB_SHA"
            exit 1
          fi
          echo "IMA_PAGES=VERIFIED"

      - name: Verify the real public GitHub Pages response
        shell: bash
        env:
          SITE: https://imaosglobal.github.io/Ima-kernel
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          raw_version_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/version.json"
          raw_index_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/index.html"
          version="$(curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 "$raw_version_url")"
          printf '%s' "$version" | grep -Fq "\"version\": \"$expected\""
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 "$raw_index_url" -o /tmp/live-index.html
          grep -Fq "$expected" /tmp/live-index.html
          grep -Fq "accounts.google.com/gsi/client" /tmp/live-index.html
          grep -Fq 'id="root"' /tmp/live-index.html
          echo "IMA_GHPAGES_BRANCH_LIVE=VERIFIED"
          echo "IMA_GHPAGES_BRANCH_SHA=$expected"
          pages_ok=0
          for attempt in $(seq 1 12); do
            echo "Public Pages CDN observation $attempt/12"
            if curl -fsSL --retry 1 --connect-timeout 10 --max-time 15 "$SITE/version.json?ts=$(date +%s%N)" 2>/dev/null | grep -Fq "\"version\": \"$expected\""; then
              echo "IMA_PUBLIC_PAGES_CDN=VERIFIED"
              pages_ok=1
              break
            fi
            sleep 10
          done
          if [ "$pages_ok" -ne 1 ]; then
            echo "WARNING: Pages CDN did not expose the new SHA within the observation window; gh-pages branch is verified."
          fi

          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          evidence = {
              "verified": True,
              "source_sha": os.environ["GITHUB_SHA"],
              "public_url": os.environ["SITE"] + "/",
              "version_url": os.environ["SITE"] + "/version.json",
              "verified_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "checks": ["gh_pages_publish", "version_sha", "live_index_sha", "google_gis_script", "react_root"],
          }
          Path("/tmp/ima-gh-pages/public-live-verification.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
          cd /tmp/ima-gh-pages
          git add public-live-verification.json
          git commit -m "chore: record public IMA Pages live verification"
          git push origin HEAD:gh-pages
          echo "IMA_PUBLIC_LIVE_EVIDENCE=PUBLISHED"

      - name: Install browser smoke-test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          playwright install --with-deps chromium

      - name: Verify critical public controls in a real browser
        env:
          SITE: https://imaosglobal.github.io/Ima-kernel/
        run: python3 scripts/public_site_browser_smoke.py

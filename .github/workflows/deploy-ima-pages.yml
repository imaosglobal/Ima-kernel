name: Deploy canonical IMA public product

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ima-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ima-ui/package-lock.json

      - name: Install dependencies
        working-directory: ima-ui
        run: npm ci

      - name: Build canonical public IMA
        working-directory: ima-ui
        run: npm run build

      - name: Publish dist to the single GitHub Pages branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/ima-gh-pages
          git worktree add /tmp/ima-gh-pages origin/gh-pages
          find /tmp/ima-gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R ima-ui/dist/. /tmp/ima-gh-pages/
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('/tmp/ima-gh-pages')
          index = root / 'index.html'
          text = index.read_text(encoding='utf-8')
          text = text.replace('__IMA_BUILD_VERSION__', os.environ['GITHUB_SHA'])
          index.write_text(text, encoding='utf-8')
          (root / 'version.json').write_text(json.dumps({'version': os.environ['GITHUB_SHA']}, ensure_ascii=False), encoding='utf-8')
          PY
          touch /tmp/ima-gh-pages/.nojekyll
          cd /tmp/ima-gh-pages
          git config user.name "IMA Pages Deploy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "IMA_PAGES=UNCHANGED"
            exit 0
          fi
          git commit -m "chore: deploy canonical IMA public product"
          git push origin HEAD:gh-pages
          git fetch origin gh-pages
          if ! grep -q "$GITHUB_SHA" /tmp/ima-gh-pages/index.html; then
            echo "ERROR: gh-pages index.html does not contain deployed source SHA $GITHUB_SHA"
            exit 1
          fi
          if ! grep -q "\"version\": \"$GITHUB_SHA\"" /tmp/ima-gh-pages/version.json; then
            echo "ERROR: gh-pages version.json does not match source SHA $GITHUB_SHA"
            exit 1
          fi
          echo "IMA_PAGES=VERIFIED"

      - name: Verify the real public GitHub Pages response
        shell: bash
        env:
          SITE: https://imaosglobal.github.io/Ima-kernel
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          version_url="$SITE/version.json?ts=$(date +%s%N)"
          index_url="$SITE/?v=$expected"
          ok=0
          for attempt in $(seq 1 18); do
            echo "Public Pages verification attempt $attempt/18"
            version="$(curl -fsSL --retry 2 --connect-timeout 10 --max-time 20 "$version_url" 2>/dev/null || true)"
            if printf '%s' "$version" | grep -Fq "\"version\": \"$expected\""; then
              curl -fsSL --retry 2 --connect-timeout 10 --max-time 20 "$index_url" -o /tmp/live-index.html
              grep -Fq "$expected" /tmp/live-index.html
              grep -Fq "accounts.google.com/gsi/client" /tmp/live-index.html
              grep -Fq 'id="root"' /tmp/live-index.html
              echo "IMA_PUBLIC_PAGES_LIVE=VERIFIED"
              echo "IMA_PUBLIC_PAGES_SHA=$expected"
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "ERROR: public GitHub Pages did not expose source SHA $expected after 180 seconds"
            echo "Last version response: $version"
            exit 1
          fi

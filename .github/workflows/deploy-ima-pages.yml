name: Deploy canonical IMA public product

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ima-pages-deploy
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ima-ui/package-lock.json

      - name: Install dependencies
        working-directory: ima-ui
        run: npm ci

      - name: Build canonical public IMA
        working-directory: ima-ui
        run: npm run build

      - name: Regression gate — feedback contract must exist in canonical build
        working-directory: ima-ui
        run: |
          set -euo pipefail
          grep -Fq "המשוב נשמר וקיבל קבלה." src/App.jsx
          grep -Fq "feedback-panel" src/App.jsx
          grep -Fq "submitFeedback" src/App.jsx
          grep -Fq "SUPPORT_URL" src/App.jsx
          grep -Fq "PRIVACY_URL" src/App.jsx
          grep -Fq "GOOGLE_CAMPAIGN_URL" src/App.jsx
          if grep -Fq "המשוב התקבל תודה" src/App.jsx; then
            echo "ERROR: legacy acknowledgement detected in canonical source"
            exit 1
          fi
          bundle=$(find dist/assets -name 'index-*.js' -type f | head -n 1)
          test -n "$bundle"
          grep -Fq "המשוב נשמר וקיבל קבלה." "$bundle"
          if grep -Fq "המשוב התקבל תודה" "$bundle"; then
            echo "ERROR: legacy acknowledgement detected in built public bundle"
            exit 1
          fi
          echo "IMA_FEEDBACK_UI_CONTRACT=VERIFIED"

      - name: Publish dist to the single GitHub Pages branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/ima-gh-pages
          git worktree add /tmp/ima-gh-pages origin/gh-pages
          find /tmp/ima-gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R ima-ui/dist/. /tmp/ima-gh-pages/
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('/tmp/ima-gh-pages')
          index = root / 'index.html'
          text = index.read_text(encoding='utf-8')
          text = text.replace('__IMA_BUILD_VERSION__', os.environ['GITHUB_SHA'])
          index.write_text(text, encoding='utf-8')
          (root / 'version.json').write_text(
              json.dumps({'version': os.environ['GITHUB_SHA']}, ensure_ascii=False),
              encoding='utf-8'
          )
          PY
          touch /tmp/ima-gh-pages/.nojekyll
          cd /tmp/ima-gh-pages
          git config user.name "IMA Pages Deploy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "IMA_PAGES=UNCHANGED"
          else
            git commit -m "chore: deploy canonical IMA public product"
            git push origin HEAD:gh-pages
          fi
          git fetch origin gh-pages
          if ! grep -q "$GITHUB_SHA" /tmp/ima-gh-pages/index.html; then
            echo "ERROR: gh-pages index.html does not contain deployed source SHA $GITHUB_SHA"
            exit 1
          fi
          if ! grep -q "\"version\": \"$GITHUB_SHA\"" /tmp/ima-gh-pages/version.json; then
            echo "ERROR: gh-pages version.json does not match source SHA $GITHUB_SHA"
            exit 1
          fi
          echo "IMA_PAGES=VERIFIED"

      - name: Verify the GitHub Pages branch content and feedback contract
        env:
          SITE: https://imaosglobal.github.io/Ima-kernel
        run: |
          python3 - <<'PY'
          import base64, json, os, re, urllib.request
          expected=os.environ["GITHUB_SHA"]
          repo=os.environ["GITHUB_REPOSITORY"]
          api=f"https://api.github.com/repos/{repo}/contents"
          site=os.environ["SITE"].rstrip("/")

          def get(url):
              req=urllib.request.Request(
                  url,
                  headers={
                      "Cache-Control":"no-cache",
                      "User-Agent":"IMA-public-verifier",
                      "Accept":"application/vnd.github+json"
                  }
              )
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.read().decode("utf-8")

          def branch_file(path):
              p=json.loads(get(api+"/"+path+"?ref=gh-pages"))
              return base64.b64decode(p["content"]).decode("utf-8")

          version=json.loads(branch_file("version.json"))
          assert version.get("version")==expected, f"GH_PAGES_VERSION_MISMATCH expected={expected} actual={version}"
          index=branch_file("index.html")
          assert expected in index, "GH_PAGES_INDEX_SHA_MISSING"
          assert "accounts.google.com/gsi/client" in index, "GOOGLE_GIS_SCRIPT_MISSING"
          assert 'id="root"' in index, "REACT_ROOT_MISSING"
          match=re.search(r'assets/index-[^"]+\.js',index)
          assert match, "PUBLIC_BUNDLE_REFERENCE_MISSING"
          bundle=branch_file(match.group(0))
          required=[
              "Open IMA now",
              "Install IMA",
              "Talk to IMA",
              "beforeinstallprompt",
              "renderButton",
              "rectangular",
              "המשוב נשמר וקיבל קבלה."
          ]
          missing=[x for x in required if x not in bundle]
          assert not missing, "PUBLIC_BUNDLE_CONTRACTS_MISSING="+",".join(missing)
          assert "המשוב התקבל תודה" not in bundle, "LEGACY_FEEDBACK_ACK_PRESENT"
          for path in ("support.html","privacy.html"):
              page=branch_file(path)
              assert "IMA" in page, f"PUBLIC_PAGE_INVALID={path}"
          print("IMA_GHPAGES_BRANCH_LIVE=VERIFIED")
          print("IMA_FEEDBACK_PUBLIC_CONTRACT=VERIFIED")
          print("IMA_GHPAGES_BRANCH_SHA="+expected)

          live=json.loads(get(site+"/version.json"))
          assert live.get("version")==expected, f"LIVE_PUBLIC_VERSION_MISMATCH expected={expected} actual={live.get('version')}"
          print("IMA_PUBLIC_PAGES_VERSION="+str(live.get("version")))
          for path in ("support.html","privacy.html"):
              req=urllib.request.Request(site+"/"+path,headers={"Cache-Control":"no-cache","User-Agent":"IMA-public-verifier"})
              with urllib.request.urlopen(req,timeout=30) as resp:
                  assert 200 <= resp.status < 400, f"LIVE_PUBLIC_PAGE_FAILED={path}:{resp.status}"
          print("IMA_PUBLIC_PAGES_CDN=VERIFIED")
          PY

      - name: Install browser smoke-test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          playwright install --with-deps chromium

      - name: Verify critical public controls in a real browser
        env:
          SITE: https://imaosglobal.github.io/Ima-kernel/
        run: python3 scripts/public_site_browser_smoke.py

name: Deploy canonical IMA public product

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  repository_dispatch:
    types: [ima-canonical-deploy]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ima-pages-deploy
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      mirror_artifact_ready: ${{ steps.upload_mirror_artifact.outcome == 'success' }}
      source_sha: ${{ steps.source.outputs.sha }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve exact canonical source SHA
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ima-ui/package-lock.json

      - name: Install dependencies
        working-directory: ima-ui
        run: npm ci

      - name: Build canonical public IMA
        working-directory: ima-ui
        run: npm run build

      - name: Stamp the exact source SHA into the public artifact
        working-directory: ima-ui
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("dist")
          index = root / "index.html"
          text = index.read_text(encoding="utf-8")
          text = text.replace("__IMA_BUILD_VERSION__", os.environ["SOURCE_SHA"])
          index.write_text(text, encoding="utf-8")
          (root / "version.json").write_text(
              json.dumps({"version": os.environ["SOURCE_SHA"]}, ensure_ascii=False),
              encoding="utf-8",
          )
          PY

      - name: Regression gate — critical public contracts
        working-directory: ima-ui
        run: |
          set -euo pipefail
          grep -Fq "המשוב נשמר וקיבל קבלה." src/App.jsx
          grep -Fq "feedback-panel" src/App.jsx
          grep -Fq "submitFeedback" src/App.jsx
          grep -Fq "SUPPORT_URL" src/App.jsx
          grep -Fq "PRIVACY_URL" src/App.jsx
          grep -Fq "GOOGLE_CAMPAIGN_URL" src/App.jsx
          grep -Fq "install-button" src/App.jsx
          grep -Fq "renderButton" src/App.jsx
          if grep -Fq "המשוב התקבל תודה" src/App.jsx; then
            echo "ERROR: legacy feedback acknowledgement detected"
            exit 1
          fi
          bundle=$(find dist/assets -name 'index-*.js' -type f | head -n 1)
          test -n "$bundle"
          for required in "המשוב נשמר וקיבל קבלה." "feedback-panel" "beforeinstallprompt" "install-button"; do
            grep -Fq "$required" "$bundle" || { echo "ERROR: missing bundle contract: $required"; exit 1; }
          done
          if grep -Fq "המשוב התקבל תודה" "$bundle"; then
            echo "ERROR: legacy feedback acknowledgement detected in bundle"
            exit 1
          fi
          test -f dist/support.html
          test -f dist/privacy.html
          test -f dist/version.json
          echo "IMA_PUBLIC_ARTIFACT_CONTRACT=VERIFIED"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload canonical Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: ima-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ima-ui/dist

      - name: Deploy canonical Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ima-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify public release
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request
          site = os.environ["SITE"].rstrip("/")
          expected = os.environ["EXPECTED_SHA"]

          def get(path):
              req = urllib.request.Request(
                  site + path,
                  headers={"Cache-Control":"no-cache","User-Agent":"IMA-public-verifier"},
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, r.read().decode("utf-8")

          last = None
          for attempt in range(1, 13):
              try:
                  status, body = get("/version.json")
                  if status == 200:
                      data = json.loads(body)
                      if data.get("version") == expected:
                          print("IMA_PUBLIC_VERSION=VERIFIED")
                          break
                      last = f"version mismatch: {data}"
                  else:
                      last = f"http status {status}"
              except Exception as exc:
                  last = repr(exc)
              time.sleep(5)
          else:
              raise SystemExit(f"PUBLIC_VERSION_VERIFY_FAILED: {last}")

          for path in ("/support.html", "/privacy.html"):
              status, _ = get(path)
              if not 200 <= status < 400:
                  raise SystemExit(f"PUBLIC_PAGE_FAILED: {path} status={status}")
          print("IMA_PUBLIC_STATIC_PAGES=VERIFIED")
          status, index = get("/")
          if status != 200:
              raise SystemExit(f"PUBLIC_INDEX_FAILED: status={status}")
          marker = f'<meta name="ima-build-version" content="{expected}"'
          if marker not in index:
              raise SystemExit("PUBLIC_INDEX_VERSION_VERIFY_FAILED")
          if 'id="root"' not in index or "assets/index-" not in index:
              raise SystemExit("PUBLIC_INDEX_IS_NOT_CANONICAL_REACT_BUILD")
          print("IMA_PUBLIC_INDEX=VERIFIED")
          PY

      - name: Upload exact verified build for gh-pages mirror
        id: upload_mirror_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ima-public-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: ima-ui/dist
          if-no-files-found: error
          retention-days: 1

      - name: Install browser smoke-test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          playwright install --with-deps chromium

      - name: Verify critical public controls in a real browser
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: python3 scripts/public_site_browser_smoke.py

  mirror-gh-pages:
    name: Mirror verified canonical artifact to gh-pages
    needs: build-and-publish
    if: always() && needs.build-and-publish.outputs.mirror_artifact_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download exact verified artifact
        uses: actions/download-artifact@v4
        with:
          name: ima-public-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: site

      - name: Checkout gh-pages mirror branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0
          persist-credentials: true

      - name: Mirror and verify source SHA
        env:
          SOURCE_SHA: ${{ needs.build-and-publish.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          actual = json.loads(Path("site/version.json").read_text(encoding="utf-8")).get("version")
          expected = os.environ["SOURCE_SHA"]
          if actual != expected:
              raise SystemExit(f"artifact SHA mismatch: {actual} != {expected}")
          PY
          rsync -a --delete --exclude='.git' site/ gh-pages/
          touch gh-pages/.nojekyll
          git -C gh-pages config user.name "IMA Pages Mirror"
          git -C gh-pages config user.email "actions@users.noreply.github.com"
          git -C gh-pages add -A
          if ! git -C gh-pages diff --cached --quiet; then
            git -C gh-pages commit -m "mirror: canonical IMA Pages ${SOURCE_SHA}"
            git -C gh-pages push origin HEAD:gh-pages
          fi
          git -C gh-pages fetch origin gh-pages
          remote_version="$(git -C gh-pages show origin/gh-pages:version.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          test "$remote_version" = "$SOURCE_SHA"
          echo "IMA_GH_PAGES_VERSION=VERIFIED"

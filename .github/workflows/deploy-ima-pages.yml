name: Deploy canonical IMA public product

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ima-pages-deploy
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ima-ui/package-lock.json

      - name: Install dependencies
        working-directory: ima-ui
        run: npm ci

      - name: Build canonical public IMA
        working-directory: ima-ui
        run: npm run build

      - name: Publish dist to the single GitHub Pages branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/ima-gh-pages
          git worktree add /tmp/ima-gh-pages origin/gh-pages
          find /tmp/ima-gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R ima-ui/dist/. /tmp/ima-gh-pages/
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('/tmp/ima-gh-pages')
          index = root / 'index.html'
          text = index.read_text(encoding='utf-8')
          text = text.replace('__IMA_BUILD_VERSION__', os.environ['GITHUB_SHA'])
          index.write_text(text, encoding='utf-8')
          (root / 'version.json').write_text(json.dumps({'version': os.environ['GITHUB_SHA']}, ensure_ascii=False), encoding='utf-8')
          PY
          touch /tmp/ima-gh-pages/.nojekyll
          cd /tmp/ima-gh-pages
          git config user.name "IMA Pages Deploy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "IMA_PAGES=UNCHANGED"
            exit 0
          fi
          git commit -m "chore: deploy canonical IMA public product"
          git push origin HEAD:gh-pages
          git fetch origin gh-pages
          if ! grep -q "$GITHUB_SHA" /tmp/ima-gh-pages/index.html; then
            echo "ERROR: gh-pages index.html does not contain deployed source SHA $GITHUB_SHA"
            exit 1
          fi
          if ! grep -q "\"version\": \"$GITHUB_SHA\"" /tmp/ima-gh-pages/version.json; then
            echo "ERROR: gh-pages version.json does not match source SHA $GITHUB_SHA"
            exit 1
          fi
          echo "IMA_PAGES=VERIFIED"

      - name: Verify the real public GitHub Pages response
        env:
          SITE: https://imaosglobal.github.io/Ima-kernel
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          expected=os.environ["GITHUB_SHA"]
          site=os.environ["SITE"].rstrip("/")
          api_base=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents"

          def get(url):
              req=urllib.request.Request(url,headers={"Cache-Control":"no-cache","User-Agent":"IMA-public-verifier","Accept":"application/vnd.github+json"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.read().decode("utf-8")

          def get_branch_file(path):
              payload=json.loads(get(api_base+"/"+path+"?ref=gh-pages"))
              import base64
              return base64.b64decode(payload["content"]).decode("utf-8")

          version=json.loads(get_branch_file("version.json"))
          assert version.get("version")==expected, f"GH_PAGES_VERSION_MISMATCH expected={expected} actual={version}"
          index=get_branch_file("index.html")
          assert expected in index, "GH_PAGES_INDEX_SHA_MISSING"
          assert "accounts.google.com/gsi/client" in index, "GOOGLE_GIS_SCRIPT_MISSING"
          assert 'id="root"' in index, "REACT_ROOT_MISSING"
          import re
          match=re.search(r'assets/index-[^"]+\.js',index)
          assert match, "PUBLIC_BUNDLE_REFERENCE_MISSING"
          bundle=get_branch_file(match.group(0))
          required=["Open IMA now","Install IMA","Talk to IMA","beforeinstallprompt","renderButton","rectangular"]
          missing=[x for x in required if x not in bundle]
          assert not missing, "PUBLIC_BUNDLE_CONTRACTS_MISSING="+",".join(missing)
          print("IMA_GHPAGES_BRANCH_LIVE=VERIFIED")
          print("IMA_PUBLIC_BUNDLE_CRITICAL_CONTRACTS=VERIFIED")
          print("IMA_GHPAGES_BRANCH_SHA="+expected)

          cdn_ok=False
          for attempt in range(30):
              try:
                  live=json.loads(get(site+"/version.json?ts="+str(time.time_ns())))
                  if live.get("version")==expected:
                      cdn_ok=True
                      print("IMA_PUBLIC_PAGES_CDN=VERIFIED")
                      break
              except Exception as exc:
                  print("CDN_CHECK_ERROR",type(exc).__name__)
              time.sleep(10)
          if not cdn_ok:
              print("WARNING: IMA_PUBLIC_PAGES_CDN_NOT_VERIFIED; scheduled browser QA will continue monitoring propagation.")
          PY

          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          evidence = {
              "verified": True,
              "cdn_verified": cdn_ok,
              "source_sha": os.environ["GITHUB_SHA"],
              "public_url": os.environ["SITE"] + "/",
              "version_url": os.environ["SITE"] + "/version.json",
              "verified_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "checks": ["gh_pages_publish", "version_sha", "live_index_sha", "public_bundle_contracts", "google_gis_script", "react_root", "pages_cdn"],
          }
          Path("/tmp/ima-gh-pages/public-live-verification.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
          cd /tmp/ima-gh-pages
          git add public-live-verification.json
          git commit -m "chore: record public IMA Pages live verification"
          git push origin HEAD:gh-pages
          echo "IMA_PUBLIC_LIVE_EVIDENCE=PUBLISHED"

      - name: Install browser smoke-test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          playwright install --with-deps chromium

      - name: Verify critical public controls in a real browser
        env:
          SITE: https://imaosglobal.github.io/Ima-kernel/
        run: python3 scripts/public_site_browser_smoke.py

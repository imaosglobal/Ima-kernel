name: IMA public pages

on:
  push:
    branches: [main]
    paths:
      - 'ima-ui/**'
      - '.github/workflows/ima-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ima-ui/package-lock.json
      - name: Build IMA UI
        working-directory: ima-ui
        run: |
          npm ci
          npm run build
      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./ima-ui/dist
          force_orphan: false

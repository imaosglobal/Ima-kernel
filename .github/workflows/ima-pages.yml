name: IMA GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "ima-ui/**"
      - "docs/IMA_CAPABILITY_REGISTRY.json"
      - ".github/workflows/ima-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ima-ui/package-lock.json

      - name: Install
        working-directory: ima-ui
        run: npm ci

      - name: Lint
        working-directory: ima-ui
        run: npm run lint

      - name: Build
        working-directory: ima-ui
        env:
          VITE_IMA_API_BASE: https://ima-915m.onrender.com
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ima-ui/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

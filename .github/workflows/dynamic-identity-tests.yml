name: IMA dynamic identity regression tests

on:
  pull_request:
    paths:
      - "core/dynamic_identity.py"
      - "core/human_intelligence.py"
      - "core/ima_loop.py"
      - "ima_master_runtime.py"
      - "ima_mom.py"
      - "tests/test_dynamic_identity.py"
      - ".github/workflows/dynamic-identity-tests.yml"
  push:
    branches:
      - main
    paths:
      - "core/dynamic_identity.py"
      - "core/human_intelligence.py"
      - "core/ima_loop.py"
      - "ima_master_runtime.py"
      - "ima_mom.py"
      - "tests/test_dynamic_identity.py"
      - ".github/workflows/dynamic-identity-tests.yml"

permissions:
  contents: read

jobs:
  dynamic-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run dynamic identity regression tests
        run: python -m unittest discover -s tests -p "test_dynamic_identity.py" -v

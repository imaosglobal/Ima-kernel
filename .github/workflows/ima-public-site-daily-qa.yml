name: IMA Daily Public Site QA

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ima-public-site-qa
  cancel-in-progress: true

jobs:
  public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Python QA dependencies
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: Check public site, Google sign-in, buttons, links and images
        env:
          SITE: https://imaosglobal.github.io/Ima-kernel/
          API: https://ima-915m.onrender.com
        run: python3 scripts/public_site_qa.py

      - name: Real-browser critical control smoke test
        env:
          SITE: https://imaosglobal.github.io/Ima-kernel/
        run: python3 scripts/public_site_browser_smoke.py

      - name: Real-browser critical control smoke test
        env:
          SITE: https://imaosglobal.github.io/Ima-kernel/
        run: python3 scripts/public_site_browser_smoke.py

      - name: Verify all README headings are English
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          bad=[]
          for p in Path('.').rglob('README.md'):
              if any(part.startswith('_archive') for part in p.parts):
                  continue
              for n,line in enumerate(p.read_text(encoding='utf-8', errors='ignore').splitlines(),1):
                  if re.match(r'^#{1,6}\s+', line) and re.search(r'[\u0590-\u05ff]', line):
                      bad.append(f"{p}:{n}:{line}")
          if bad:
              print("\n".join(bad))
              raise SystemExit("README_HEADING_LANGUAGE_REGRESSION")
          print("README_HEADINGS_ENGLISH=PASS")
          PY

      - name: Verify canonical campaign destination
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path("ima-ui/src/App.jsx").read_text(encoding="utf-8")
          required="utm_source=google&utm_medium=cpc&utm_campaign=ima_initial_100ils"
          assert required in text, "Google campaign destination missing from IMA image"
          print("IMA_CAMPAIGN_DESTINATION=PASS")
          PY

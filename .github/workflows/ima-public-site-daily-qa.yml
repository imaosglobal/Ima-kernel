name: IMA Daily Public Site QA

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ima-public-site-qa
  cancel-in-progress: true

jobs:
  public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install browser QA dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright requests beautifulsoup4
          playwright install --with-deps chromium
      - name: Verify public source contracts
        run: |
          set -euo pipefail
          grep -Fq 'MamaFigure' ima-ui/src/App.jsx
          grep -Fq 'ChatPanel' ima-ui/src/App.jsx
          grep -Fq 'feedback-panel' ima-ui/src/App.jsx
          grep -Fq 'beforeinstallprompt' ima-ui/src/App.jsx
          grep -Fq 'campaignId=24409551537' ima-ui/src/App.jsx
          echo "IMA_DAILY_SOURCE_CONTRACTS=PASS"
      - name: Real-browser public smoke
        env:
          SITE: https://imaosglobal.github.io/Ima-kernel/
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 scripts/public_site_browser_smoke.py

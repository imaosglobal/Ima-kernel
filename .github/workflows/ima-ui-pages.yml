name: IMA UI Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_IMA_API_BASE: https://ima-915m.onrender.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ima-ui/package-lock.json
      - run: npm ci
        working-directory: ima-ui
      - run: npm run build
        working-directory: ima-ui
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ima-ui/dist
  # Deliberately no deploy job: the canonical public deployment is deploy-ima-pages.yml.

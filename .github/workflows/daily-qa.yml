name: IMA Daily QA

on:
  schedule:
    - cron: "27 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ima-daily-qa
  cancel-in-progress: true

jobs:
  qa:
    name: Product and public runtime checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run canonical daily QA
        run: python3 qa/daily_qa.py

name: IMA public chat canary

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  public-chat-canary:
    runs-on: ubuntu-latest
    steps:
      - name: Verify session/chat stability
        env:
          IMA_BASE_URL: https://ima-915m.onrender.com
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          base = os.environ["IMA_BASE_URL"].rstrip("/")

          def request(path, method="GET", payload=None, headers=None):
              body = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  base + path,
                  data=body,
                  method=method,
                  headers={"Content-Type": "application/json", **(headers or {})},
              )
              with urllib.request.urlopen(req, timeout=25) as response:
                  return response.status, json.loads(response.read().decode())

          tokens = []
          for i in range(12):
              status, data = request("/ima-api/session", headers={"X-IMA-Transport": "canonical-live-v3"})
              if status != 200 or not data.get("token"):
                  raise SystemExit(f"session probe {i+1} failed: HTTP {status}")
              tokens.append(data["token"])

          for i, token in enumerate(tokens, 1):
              status, data = request(
                  "/ima-api/chat",
                  method="POST",
                  payload={"message": "בדיקת יציבות קנונית", "personalization": {"language": "he", "canary": True}},
                  headers={
                      "Authorization": "Bearer " + token,
                      "X-IMA-Client": "production-canary",
                      "X-IMA-Transport": "canonical-live-v3",
                  },
              )
              if status != 200:
                  raise SystemExit(f"chat probe {i} failed: HTTP {status} body={data}")
              if not data.get("response"):
                  raise SystemExit(f"chat probe {i} returned no IMA response")

          print("IMA public session/chat canary passed: 12 independent session→chat flows.")
          PY

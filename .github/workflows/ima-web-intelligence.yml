name: IMA Global Web Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: ima-web-intelligence
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Test
        run: python -m unittest tests/test_web_intelligence.py -v
      - name: Discover
        run: python .ima/web_intelligence/global_discovery.py --once > /tmp/ima-web-intelligence.json
      - name: Validate result
        run: |
          python - <<'PY'
          import json
          d=json.load(open("/tmp/ima-web-intelligence.json"))
          assert d["status"] == "completed"
          assert d["latest_commoncrawl"]
          print("IMA_WEB_INTELLIGENCE=PASS")
          print("discovered=", d["discovered"], "changed=", d["changed"])
          PY
      - name: Persist evidence
        run: |
          mkdir -p artifacts/web-intelligence
          cp /tmp/ima-web-intelligence.json artifacts/web-intelligence/latest.json
          git add .ima/web_intelligence/state.json artifacts/web-intelligence/latest.json
          if git diff --cached --quiet; then
            echo "IMA_WEB_INTELLIGENCE_NO_CHANGE=1"
            exit 0
          fi
          git config user.name "IMA Web Intelligence"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: refresh global web intelligence state"
          git push

name: Repo - Github Stats

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  j1:
    name: github-repo-stats
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Repository stats
        run: |
          echo "Repository traffic stats collection is disabled."
          echo "No personal token or secret is required."
          echo "GitHub Traffic API requires Administration: read permission."
          echo "Workflow completed successfully without collecting traffic data."

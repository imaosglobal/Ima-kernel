name: IMA Daily Lifelong Learning

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "artifacts/web-intelligence/adaptation-state.json"
  schedule:
    - cron: "07 1 * * *"

permissions:
  contents: write

concurrency:
  group: ima-daily-lifelong-learning
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install web intelligence dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Listen and refresh discovery evidence
        run: |
          python -m unittest tests/test_web_intelligence.py -v
          python .ima/web_intelligence/global_discovery.py --once > /tmp/ima-web-intelligence.json
      - name: Learn compare prototype test and verify
        run: |
          python -m unittest tests/test_adaptation_evaluator.py -v
          python .ima/web_intelligence/adaptation_evaluator.py > /tmp/ima-adaptation.json
      - name: Persist the single daily synthesis
        run: |
          mkdir -p artifacts/web-intelligence
          cp /tmp/ima-adaptation.json artifacts/web-intelligence/adaptation-state.json
          git add .ima/web_intelligence/state.json artifacts/web-intelligence/adaptation-state.json artifacts/web-intelligence/adaptation_candidates.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "IMA Adaptation Steward"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: refresh cross-domain adaptation state"
          git push


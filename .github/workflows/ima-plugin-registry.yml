name: IMA Plugin Registry Contract

on:
  push:
    paths:
      - ".ima/plugins/REGISTRY.json"
      - ".ima/plugins/README.md"
      - "tests/test_plugin_registry.py"
      - ".github/workflows/ima-plugin-registry.yml"
  pull_request:
    paths:
      - ".ima/plugins/REGISTRY.json"
      - ".ima/plugins/README.md"
      - "tests/test_plugin_registry.py"
      - ".github/workflows/ima-plugin-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate IMA plugin registry
        run: python tests/test_plugin_registry.py

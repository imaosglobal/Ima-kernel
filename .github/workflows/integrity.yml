name: IMA Integrity

on:
  push:
  pull_request:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan
        run: bash .github/SECURITY_CHECK.sh

      - name: Python syntax check
        run: |
          python3 -m compileall -q founder

      - name: Runtime integrity
        run: |
          test -f founder/executive_ai/action_engine/action_memory.py
          test -f founder/executive_ai/global_intelligence/opportunity_to_action.py
          sha256sum founder/executive_ai/action_engine/action_memory.py
          sha256sum founder/executive_ai/global_intelligence/opportunity_to_action.py

name: IMA Continuous Health

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate canonical files
        run: |
          set -e
          test -f IMA_CANONICAL_VISION.md
          test -f IMA_IDENTITY.md
          test -f android/gradlew
          test -f Dockerfile
          grep -q "android.useAndroidX=true" android/gradle.properties
          ! grep -q "aapt2FromMavenOverride" android/gradle.properties
          echo "IMA_CANONICAL_FILES=PASS"

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Python syntax check
        run: python -m py_compile app.py public_memory.py identity_context.py ima_master_runtime.py tests/public_runtime.test.py

      - name: Core and contract tests
        run: npm run ima:verify

      - name: Frontend quality
        working-directory: ima-ui
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Live deployment smoke test
        run: |
          set -u
          failures=0
          check_url() {
            name="$1"
            url="$2"
            code="$(curl -sS -L --max-time 30 -o "/tmp/ima-smoke-${name}.body" -w '%{http_code}' "$url" || true)"
            echo "IMA_SMOKE_${name}_HTTP=${code}"
            if [ "$code" != "200" ]; then
              echo "IMA_SMOKE_${name}_BODY:"
              head -c 500 "/tmp/ima-smoke-${name}.body" 2>/dev/null || true
              echo
              failures=$((failures + 1))
            fi
          }
          check_url render_health https://ima-915m.onrender.com/health
          check_url render_runtime https://ima-915m.onrender.com/ima-api/runtime
          check_url github_pages https://imaosglobal.github.io/Ima-kernel/
          if [ "$failures" -ne 0 ]; then
            echo "IMA_LIVE_DEPLOYMENT_SMOKE=FAIL count=$failures"
            exit 1
          fi
          echo "IMA_LIVE_DEPLOYMENT_SMOKE=PASS"

      - name: Check Android build
        uses: gradle/actions/setup-gradle@v4
      - name: Android APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Autonomous maintenance scan
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          gaps = json.loads(Path("integrations/IMA_LEARNING_GAPS.json").read_text(encoding="utf-8"))
          state = {
              "schema": "IMA-AUTONOMOUS-MAINTENANCE-1.0",
              "gap_types": gaps.get("gap_types", []),
              "next_cycle": ["OBSERVE", "IDENTIFY_GAPS", "PRIORITIZE", "RESEARCH", "TEST", "VERIFY", "TEACH"],
              "truth_rule": gaps.get("truth_rule")
          }
          Path("docs/IMA_AUTONOMOUS_MAINTENANCE_STATE.json").write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Record maintenance state
        run: |
          git config user.name "IMA Autonomous Steward"
          git config user.email "actions@users.noreply.github.com"
          git add docs/IMA_AUTONOMOUS_MAINTENANCE_STATE.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh autonomous maintenance state"
          git push

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'IMA continuous health failure';
            const body = [
              'Automated health/build verification failed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit: ${context.sha}`,
              '',
              'The failure must be diagnosed from the actual workflow logs before any code change.'
            ].join('\\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ima-health-failure', per_page: 10
            });
            if (existing.data.length === 0) {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['ima-health-failure']
              });
              core.info(`Created issue #${issue.data.number}`);
            } else {
              core.info('Existing health issue found; no duplicate created.');
            }

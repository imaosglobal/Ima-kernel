name: IMA Continuous Health

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate canonical files
        run: |
          set -e
          test -f IMA_CANONICAL_VISION.md
          test -f IMA_IDENTITY.md
          test -f android/gradlew
          test -f Dockerfile
          grep -q "android.useAndroidX=true" android/gradle.properties
          ! grep -q "aapt2FromMavenOverride" android/gradle.properties
          echo "IMA_CANONICAL_FILES=PASS"

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Python syntax check
        run: python -m py_compile app.py public_memory.py identity_context.py ima_master_runtime.py tests/public_runtime.test.py

      - name: Core and contract tests
        run: npm run ima:verify

      - name: Frontend quality
        working-directory: ima-ui
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Live deployment smoke test
        run: |
          set -e
          curl -fsS --max-time 30 https://ima-915m.onrender.com/health
          curl -fsS --max-time 30 https://ima-915m.onrender.com/ima-api/runtime
          curl -fsS --max-time 30 https://imaosglobal.github.io/Ima-kernel/ >/dev/null
          echo "IMA_LIVE_DEPLOYMENT_SMOKE=PASS"

      - name: Check Android build
        uses: gradle/actions/setup-gradle@v4
      - name: Android APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'IMA continuous health failure';
            const body = [
              'Automated health/build verification failed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit: ${context.sha}`,
              '',
              'The failure must be diagnosed from the actual workflow logs before any code change.'
            ].join('\\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ima-health-failure', per_page: 10
            });
            if (existing.data.length === 0) {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['ima-health-failure']
              });
              core.info(`Created issue #${issue.data.number}`);
            } else {
              core.info('Existing health issue found; no duplicate created.');
            }
